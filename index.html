<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数之塔 · 从 1 数到 10↑↑↑10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #edf1f4; --paper-2: #e3e9ee; --grid: rgba(44, 92, 150, .09); --grid-major: rgba(44, 92, 150, .16);
  --ink: #16263f; --ink-2: #485a75; --ink-3: #8593a8; --rule: rgba(22, 38, 63, .18);
  --red: #b8322a; --red-soft: rgba(184, 50, 42, .1); --hl: #f4d548; --hl-soft: rgba(244, 213, 72, .45);
  --card: #f7f9fb; --ok: #2f7d4f; --shadow: 0 1px 0 rgba(22, 38, 63, .08);
  --num: "STIX Two Text", "Times New Roman", "Songti SC", serif;
  --cn: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --head: "Noto Serif SC", "Songti SC", "SimSun", serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1d2a25; --paper-2: #17221e; --grid: rgba(225, 235, 225, .035); --grid-major: rgba(225, 235, 225, .06);
    --ink: #e8ede5; --ink-2: #aebdb3; --ink-3: #75887c; --rule: rgba(232, 237, 229, .16);
    --red: #f3907f; --red-soft: rgba(243, 144, 127, .12); --hl: #f2d16b; --hl-soft: rgba(242, 209, 107, .18);
    --card: #22312b; --ok: #8fd3a4; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1d2a25; --paper-2: #17221e; --grid: rgba(225, 235, 225, .035); --grid-major: rgba(225, 235, 225, .06);
  --ink: #e8ede5; --ink-2: #aebdb3; --ink-3: #75887c; --rule: rgba(232, 237, 229, .16);
  --red: #f3907f; --red-soft: rgba(243, 144, 127, .12); --hl: #f2d16b; --hl-soft: rgba(242, 209, 107, .18);
  --card: #22312b; --ok: #8fd3a4; --shadow: none; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%; color: var(--ink); font: 15px/1.6 var(--cn);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  -webkit-font-smoothing: antialiased;
}
button, select, input, textarea { font: inherit; color: inherit; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums lining-nums; }
.it { font-family: var(--num); font-style: italic; }

/* ---------- 布局 ---------- */
#app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
#rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 20px 20px;
  border-right: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: blur(2px);
}
#main { padding: 18px clamp(16px, 4vw, 48px) 80px; max-width: 1040px; width: 100%; }

.brand { font-family: var(--head); font-weight: 900; font-size: 20px; letter-spacing: .04em; margin: 0 0 2px; }
.brand small { font-family: var(--num); font-style: italic; font-weight: 400; font-size: 13px; color: var(--ink-3); margin-left: 6px; }

/* 主数字：数学排版 */
.hero { margin: 18px 0 6px; }
.hero .lbl { font-size: 12px; color: var(--ink-3); }
.hero .val { font-family: var(--num); font-size: 34px; line-height: 1.15; word-break: break-all; min-height: 48px; }
.hero .val .x { color: var(--ink-2); margin: 0 .12em; font-size: .8em; }
.hero .val sup, .tw sup { font-size: .58em; vertical-align: .95em; line-height: 0; }
.hero .val .arr { color: var(--red); letter-spacing: -.05em; margin: 0 .04em; }
.rate { font-family: var(--num); color: var(--ink-2); font-size: 14px; min-height: 22px; }
.famous { margin: 12px 0 4px; font-size: 12.5px; color: var(--ink-2); }
.famous b { font-family: var(--head); font-weight: 600; color: var(--ink); }
.bar { height: 6px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s; }

nav.chapters { margin-top: 20px; display: flex; flex-direction: column; gap: 2px; }
nav.chapters button {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 10px; border-radius: 4px; cursor: pointer; color: var(--ink-2); font-size: 15px;
}
nav.chapters button .s { font-family: var(--num); font-style: italic; color: var(--ink-3); width: 24px; flex: none; }
nav.chapters button:hover { background: var(--red-soft); color: var(--ink); }
nav.chapters button[aria-current="page"] { color: var(--ink); background: var(--hl-soft); font-weight: 600; }
nav.chapters button[aria-current="page"] .s { color: var(--red); }
nav.chapters button.locked { color: var(--ink-3); cursor: default; }
nav.chapters button.locked:hover { background: none; }
nav.chapters button .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--red); display: none; align-self: center; }
nav.chapters button.notify .dot { display: block; }
nav.chapters hr { border: 0; border-top: 1px dashed var(--rule); margin: 10px 0; width: 100%; }

/* 快讯 */
#news { font-size: 13px; color: var(--ink-2); border-bottom: 1px dashed var(--rule); padding: 2px 0 10px; margin-bottom: 18px; min-height: 32px; display: flex; gap: 10px; align-items: baseline; }
#news .tag { font-family: var(--num); font-style: italic; color: var(--red); flex: none; }
#news span.t { transition: opacity .4s; }

/* 章节 */
.chap-head { margin: 4px 0 20px; }
.chap-head h2 { font-family: var(--head); font-weight: 900; font-size: 30px; margin: 0; line-height: 1.25; letter-spacing: .02em; }
.chap-head h2 .s { font-family: var(--num); font-style: italic; font-weight: 400; color: var(--red); margin-right: 12px; }
.chap-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 62ch; }
h3 { font-family: var(--head); font-weight: 600; font-size: 18px; margin: 30px 0 10px; }
h3 .sub { font-family: var(--cn); font-weight: 400; font-size: 13px; color: var(--ink-3); margin-left: 8px; }
.muted { color: var(--ink-3); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* 按钮 */
.btn {
  border: 1.5px solid var(--ink); background: var(--card); padding: 7px 14px; border-radius: 3px; cursor: pointer;
  font-size: 14px; line-height: 1.3; box-shadow: 2px 2px 0 var(--rule); transition: transform .06s, box-shadow .06s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--rule); }
.btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 var(--rule); }
.btn.can { background: linear-gradient(transparent 12%, var(--hl-soft) 12%, var(--hl-soft) 88%, transparent 88%), var(--card); }
.btn[disabled], .btn.no { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--rule); }
.btn.red { border-color: var(--red); color: var(--red); }
.btn.red.can { background: var(--red); color: var(--paper); }
.btn.big { font-size: 16px; padding: 11px 20px; font-family: var(--head); font-weight: 600; }
.btn.sm { font-size: 13px; padding: 4px 10px; }
.btn small { display: block; font-size: 12px; opacity: .8; font-family: var(--num); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* 计数器表 */
.gens { border-top: 1.5px solid var(--ink); }
.gen { display: grid; grid-template-columns: 44px minmax(120px, 1.4fr) minmax(90px, 1fr) minmax(70px, .8fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.seal { width: 38px; height: 38px; display: grid; place-items: center; font-family: var(--head); font-weight: 900; font-size: 20px; color: var(--red); border: 2px solid var(--red); border-radius: 4px; transform: rotate(-3deg); }
.gen .nm { font-weight: 600; }
.gen .nm small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.gen .amt { font-family: var(--num); font-size: 16px; }
.gen .amt small { display: block; color: var(--ink-3); font-size: 12px; font-family: var(--cn); }
.gen .mul { font-family: var(--num); color: var(--ink-2); }
.gen .bt { display: flex; gap: 6px; }
.gen.next { opacity: .5; }

/* 定理框 */
.theorems { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.thm { border-left: 3px solid var(--ink); padding: 8px 14px 12px; background: var(--card); box-shadow: var(--shadow); position: relative; }
.thm .ti { font-family: var(--head); font-weight: 600; }
.thm .ti .k { font-family: var(--num); font-style: italic; font-weight: 400; color: var(--ink-3); margin-right: 6px; }
.thm .fm { font-family: var(--num); font-style: italic; font-size: 17px; margin: 4px 0; color: var(--ink-2); }
.thm .ef { font-size: 13.5px; }
.thm .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.thm.done { border-left-color: var(--ok); }
.thm.done .qed { display: inline; }
.qed { display: none; font-family: var(--num); color: var(--ok); font-size: 18px; }
.thm.lock { opacity: .55; }

/* 矩阵（无穷升级） */
.matrix { display: inline-grid; grid-template-columns: repeat(4, minmax(0, 168px)); gap: 8px; padding: 6px 18px; position: relative; max-width: 100%; }
.matrix::before, .matrix::after { content: ""; position: absolute; top: 0; bottom: 0; width: 10px; border: 2px solid var(--ink); }
.matrix::before { left: 0; border-right: 0; }
.matrix::after { right: 0; border-left: 0; }
.cell { border: 1px solid var(--rule); background: var(--card); padding: 8px 9px; font-size: 13px; cursor: pointer; text-align: left; border-radius: 2px; min-height: 92px; display: flex; flex-direction: column; gap: 2px; }
.cell b { font-family: var(--head); font-weight: 600; font-size: 14px; }
.cell .c { margin-top: auto; font-family: var(--num); color: var(--ink-2); }
.cell.can { background: linear-gradient(transparent 0, var(--hl-soft) 0), var(--card); border-color: var(--ink); }
.cell.done { border-color: var(--ok); }
.cell.done .c::after { content: " ∎"; color: var(--ok); }
.cell.lock { opacity: .45; cursor: default; }

/* 卡片式面板 */
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; box-shadow: var(--shadow); }
.panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.panel h4 { margin: 0 0 4px; font-family: var(--head); font-weight: 600; font-size: 16px; }
.panel .big { font-family: var(--num); font-size: 24px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-family: var(--num); }

/* 质数网格 */
.pgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; max-width: 560px; font-family: var(--num); font-size: 12px; }
.pgrid span { border: 1px solid var(--rule); padding: 4px 2px; text-align: center; color: var(--ink-3); overflow: hidden; text-overflow: clip; white-space: nowrap; }
.pgrid span.p { color: var(--paper); background: var(--red); border-color: var(--red); font-weight: 600; }
.mers { display: flex; flex-wrap: wrap; gap: 5px; font-family: var(--num); font-size: 12.5px; }
.mers span { border: 1px dashed var(--rule); padding: 1px 6px; color: var(--ink-3); border-radius: 10px; }
.mers span.f { border-style: solid; border-color: var(--red); color: var(--red); }

/* 猜想 */
.probs { counter-reset: prob; display: grid; gap: 12px; }
.prob { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.prob .k { font-family: var(--num); font-style: italic; font-size: 22px; color: var(--red); }
.prob .ti { font-family: var(--head); font-weight: 600; font-size: 17px; }
.prob .st { font-size: 13px; color: var(--ink-2); }
.prob.done .ti::after { content: " ∎"; font-family: var(--num); color: var(--ok); }
.prob.cur { background: var(--hl-soft); }

/* 常数 */
.const { border-left: 3px solid var(--red); }
.digits { font-family: var(--num); font-size: 18px; word-break: break-all; line-height: 1.5; margin: 6px 0; max-height: 7.5em; overflow-y: auto; }
.digits .nx { color: var(--ink-3); }
.digits .sym { font-style: italic; color: var(--red); margin-right: 6px; }

/* 塔 */
.tower { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 2px; min-height: 40px; }
.tower span { font-family: var(--num); font-size: 15px; border: 1px solid var(--ink); padding: 0 8px; background: var(--card); }
.tower span:nth-child(odd) { margin-left: 10px; }
.tower span.part { opacity: .5; border-style: dashed; }
.prog { font-family: var(--num); font-size: 44px; line-height: 1.1; }
.prog .arr { color: var(--red); }

/* 成就 */
.achs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.ach { border: 1px solid var(--rule); min-height: 64px; padding: 6px; font-size: 12.5px; background: var(--card); border-radius: 2px; position: relative; }
.ach b { display: block; font-family: var(--head); font-weight: 600; font-size: 13px; }
.ach.got { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--card)); }
.ach:not(.got) { color: var(--ink-3); }
.flist { display: grid; gap: 4px; }
.flist div { display: grid; grid-template-columns: 24px 160px 1fr; gap: 10px; font-size: 13.5px; align-items: baseline; }
.flist div.got { color: var(--ink); }
.flist div:not(.got) { color: var(--ink-3); }
.flist .m { font-family: var(--num); color: var(--ok); }

/* 浮层 */
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(340px, 90vw); }
.toast { background: var(--card); border: 1.5px solid var(--ink); border-left: 5px solid var(--red); padding: 9px 14px; font-size: 14px; box-shadow: 3px 3px 0 var(--rule); animation: tin .25s ease-out; }
.toast b { font-family: var(--head); }
@keyframes tin { from { transform: translateX(30px); opacity: 0; } }
#modal { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 70%, transparent); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 60; padding: 20px; }
#modal.on { display: grid; }
#modal .box { background: var(--card); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--rule); max-width: 560px; width: 100%; padding: 26px 28px; max-height: 90vh; overflow-y: auto; }
#modal .box h2 { font-family: var(--head); font-weight: 900; margin: 0 0 10px; font-size: 26px; }
#modal .box .glyph { font-family: var(--num); font-size: 72px; color: var(--red); line-height: 1; margin-bottom: 8px; }
#modal .box p { margin: 8px 0; }
#modal .box .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 90px; background: var(--paper-2); border: 1px solid var(--rule); padding: 8px; font-family: var(--num); font-size: 12px; border-radius: 3px; }
select, input[type=text] { background: var(--card); border: 1px solid var(--ink); padding: 5px 8px; border-radius: 3px; }
label.tg { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; user-select: none; }
canvas#frac { width: 100%; max-width: 340px; aspect-ratio: 1.1547; display: block; }
.mobilebar { display: none; }

/* ---------- 窄屏 ---------- */
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  #rail { position: sticky; top: 0; height: auto; z-index: 20; padding: 10px 14px 0; border-right: 0; border-bottom: 1px solid var(--rule); background: var(--paper); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
  .brand { font-size: 15px; }
  .hero { margin: 4px 0 0; }
  .hero .val { font-size: 24px; min-height: 32px; }
  .famous, .hero .lbl { display: none; }
  nav.chapters { flex-direction: row; overflow-x: auto; margin: 8px -14px 0; padding: 0 10px 6px; gap: 0; scrollbar-width: none; }
  nav.chapters button { width: auto; flex: none; padding: 6px 10px; font-size: 14px; }
  nav.chapters button .s { width: auto; }
  nav.chapters hr { display: none; }
  #main { padding: 14px 14px 80px; }
  .gen { grid-template-columns: 40px 1fr auto; }
  .gen .mul { display: none; }
  .gen .bt { grid-column: 2 / 4; }
  .matrix { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
  .achs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .flist div { grid-template-columns: 20px 110px 1fr; }
  .chap-head h2 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <p class="brand">数之塔<small>v1.0.0</small></p>
    <div class="hero" aria-live="off">
      <div class="lbl">你数到了</div>
      <div class="val" id="heroVal">10</div>
      <div class="rate" id="heroRate"></div>
    </div>
    <div class="famous" id="famous"></div>
    <nav class="chapters" id="nav" aria-label="章节"></nav>
  </aside>
  <main id="main">
    <div id="news"><span class="tag">快讯</span><span class="t" id="newsT"></span></div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>

  C.zeno = hasI('i1') ? Math.log10(1 + S.time.all / 60) * 0.25 : 0;
  C.cantor = hasI('i4') ? sc(Math.log10(1 + S.inf.cnt) * 0.5, 4).toNumber() : 0;
  const intrBase = lg(C.boostMult).add(lg(C.spdMult)).add(Math.log10(1.03) * C.achN).add(C.zeno).add(C.cantor);
  for (let k = 0; k < 8; k++) {
    let L = intrBase.add(Math.log10(B) * Math.floor(S.gens[k].b / 10));
    if (hasTh(1) && k < 2) L = L.add(Math.log10(3));
    if (k === 0) L = L.add(Math.log10(2) * C.mers);
    if (hasTh(6)) L = L.add(Math.log10(k + 1));
    C.genLog[k] = k === 0 ? L.mul(E).add(X) : L.mul(E);
  }
  // 超运算塔高
  C.hEff = hyEff();
  // ∞ 点
  C.ipMultLog = new Decimal(Math.log10(2) * S.inf.rep)
    .add(hasI('i15') ? Math.log10(2) : 0)
    .add(digitsFor('e') * 2 * Math.LOG10E)
    .add(hasB('b3') ? sc(Math.log10(1 + S.inf.cnt) * 0.3, 30) : 0)
    .add(hasB('b8') ? 3 : 0)
    .add(hasT('t3') ? Math.log10(1 + S.tr.cnt) * 2 : 0);
  C.igW = hasB('b7') ? 1.5 : 1;
  { let r = 0; S.inf.g.forEach((g, j) => { r += (j + 1) * (j + 1) * g.b; });
    C.ieRate = new Decimal((TUNE.ier ?? 5e-4) * r * C.igW * (1 + digitsFor('phi') * 0.05)); }
  // 超越点
  C.tpMultLog = new Decimal(Math.log10(1 + digitsFor('gamma')) * 2).add(hasT('t9') ? 1 : 0).add(S.tr.fr * Math.log10(1.585));
  // 基数
  C.kMultLog = new Decimal(hasZ('z3') ? Math.log10(2) : 0).add(hasZ('z8') ? Math.log10(1 + S.st.s / 10) : 0);
  C.sRate = setRate();
}

function hyEff() { return S.hy.h; }
function hyRate() {
  let r = (TUNE.hr0 ?? 4e-6);
  const mul = { h1: 2, h2: 2, h4: 2, h6: 2, h7: 1.5, h9: 1.5, h10: 1.5 };
  for (const id in mul) if (hasH(id)) r *= mul[id];
  if (hasP('p3')) r *= 10;
  r *= 1 + (TUNE.hrk ?? 0.08) * S.hy.rep;
  return r;
}
function peRate() {
  let r = (TUNE.pr0 ?? 4.5e-6);
  const mul = { p1: 2, p2: 2, p4: 2, p5: 1.6, p7: 1.6, p8: 1.5, p9: 1.5, p10: 1.4, p11: 1.3 };
  for (const id in mul) if (hasP(id)) r *= mul[id];
  r *= 1 + (TUNE.prk ?? 0.06) * S.pt.rep;
  // 抵达 10↑↑↑10 之后越来越慢
  if (S.pt.p > END_P) r /= Math.pow(10, (S.pt.p - END_P) * 0.6);
  return r;
}
function setRate() {
  if (S.st.al <= 0) return 0;
  let r = (TUNE.sr ?? 6e-5) * Math.pow(S.st.al, hasZ('z7') ? 1.2 : 1);
  if (hasZ('z5')) r *= 2;
  if (hasZ('z9')) r *= 2;
  if (hasH('h3')) r *= 3;
  if (hasH('h8')) r *= 5;
  return r;
}

/* ---------- 增益预估 ---------- */
function ipGain() {
  let base;
  if (!S.inf.brk || S.inf.chal) base = canCrunch() ? new Decimal(1) : new Decimal(0);
  else base = S.n.gte(INF) ? pow10(lg(S.n).div(308).sub(0.75)).floor().max(1) : new Decimal(0);
  return base.mul(pow10(C.ipMultLog)).floor();
}
function tpGain() {
  const L = lg(S.n);
  if (L.lt(TR_REQ)) return new Decimal(0);
  return pow10(L.div(TR_REQ).sub(1).add(C.tpMultLog)).floor();
}
function kGain() {
  const L = lg(S.n);
  if (L.lt(FO_REQ)) return new Decimal(0);
  let k = L.div(FO_REQ).pow(0.5);
  if (hasH('h6')) k = k.pow(1.5);
  return k.mul(pow10(C.kMultLog)).floor();
}
function slogN() { return S.n.lte(1) ? 0 : S.n.slog(10).toNumber(); }

/* ============================================================
   购买操作
   ============================================================ */
function tiersOpen() { return Math.min(8, 4 + S.boost); }
function genUnitCost(k) { return genCost(k).cost(Math.floor(S.gens[k].b / 10)); }
function buyGen(k, mode = 'one', budget = null) {   // one | ten | max
  if (k >= tiersOpen()) return false;
  const g = S.gens[k], cost = genCost(k);
  let bought = false;
  for (let guard = 0; guard < 40; guard++) {
    const grp = Math.floor(g.b / 10), price = cost.cost(grp), rem = 10 - g.b % 10;
    const cash = budget ? Decimal.min(budget, S.n) : S.n;
    if (cash.lt(price)) break;
    if (mode === 'one') { S.n = S.n.sub(price).max(0); g.b++; g.a = g.a.add(1); return true; }
    if (cash.gte(price.mul(rem))) { S.n = S.n.sub(price.mul(rem)).max(0); if (budget) budget = budget.sub(price.mul(rem)); g.b += rem; g.a = g.a.add(rem); bought = true; }
    else { const u = Math.floor(cash.div(price).toNumber()); if (u > 0 && (mode === 'max' || mode === 'grp')) { S.n = S.n.sub(price.mul(u)).max(0); g.b += u; g.a = g.a.add(u); bought = true; } break; }
    if (mode === 'ten' || mode === 'grp') break;
    const cash2 = budget ? Decimal.min(budget, S.n) : S.n;
    const r = bulk(cost, Math.floor(g.b / 10), cash2.div(10));
    if (r && r.n - 1 > Math.floor(g.b / 10) + 1) {
      const add = (r.n - 1 - Math.floor(g.b / 10)) * 10;
      S.n = S.n.sub(r.spent.mul(10)).max(0); if (budget) budget = budget.sub(r.spent.mul(10)).max(0);
      g.b += add; g.a = g.a.add(add);
    }
  }
  return bought;
}
function buySpd(max = true, budget = null) {
  if (inC(1)) return false;
  const cash = budget ? Decimal.min(budget, S.n) : S.n;
  const r = bulk(SPD_COST, S.spd, cash, max ? Infinity : 1);
  if (!r) return false;
  S.n = S.n.sub(r.spent).max(0); S.spd = r.n; return true;
}
// 均衡的“全部最大”：先各用千分之一预算批量购买，再按价格从低到高逐组购买
function buyMaxAll() {
  let any = false;
  const open = tiersOpen();
  const bud = S.n.div(1000);
  if (bud.gt(1e6)) {
    for (let k = open - 1; k >= 0; k--) any = buyGen(k, 'max', bud) || any;
    any = buySpd(true, bud) || any;
  }
  for (let it = 0; it < 60; it++) {
    let best = -1, bp = null;
    for (let k = 0; k < open; k++) { const p = genUnitCost(k); if (!bp || p.lt(bp)) { bp = p; best = k; } }
    const sp = inC(1) ? null : SPD_COST.cost(S.spd);
    if (sp && sp.lt(bp)) { if (S.n.lt(sp)) break; buySpd(false); any = true; continue; }
    if (S.n.lt(bp)) break;
    buyGen(best, 'grp'); any = true;
  }
  return any;
}
function clickN() { S.clicks++; S.n = S.n.add(1); }
function buyTh(id) {
  const t = THEOREMS[id - 1];
  if (S.th[id] || S.n.lt(pow10(t.c))) return false;
  S.n = S.n.sub(pow10(t.c)); S.th[id] = true; return true;
}
function buySieve(max = true) {
  if (!unl.sieve()) return false;
  const r = bulk(SIEVE_COST, S.sv.lv, S.n, max ? Infinity : 1);
  if (!r) return false;
  S.n = S.n.sub(r.spent).max(0); S.sv.lv = r.n; return true;
}

/* ---------- 数位扩展 / 进制跃迁 ---------- */
function boostReq() {
  if (S.boost < 4) return { tier: 4 + S.boost - 1, amt: 20 };
  return { tier: 7, amt: 20 + 15 * (S.boost - 4) };
}
function canBoost() {
  if (inC(4) && S.boost >= 5) return false;
  const r = boostReq(); return S.gens[r.tier].b >= r.amt;
}
function resetGens(keepBoost) {
  S.n = hasI('i14') ? D(1e25) : D(10);
  for (const g of S.gens) { g.a = D(0); g.b = 0; }
  S.spd = 0;
  if (!keepBoost) S.boost = (hasI('i2') && !inC(4)) ? 4 : 0;
}
function doBoost() {
  if (!canBoost()) return false;
  // 批量：若满足多次（在 8 阶之后）
  if (S.boost >= 4) {
    const t8 = S.gens[7].b; let n = Math.floor((t8 - 20) / 15) + 5;
    if (inC(4)) n = Math.min(n, 5);
    S.boost = Math.max(S.boost + 1, n);
  } else S.boost++;
  if (!(S.inf.brk && !S.inf.chal)) resetGens(true);
  return true;
}
function baseReq() { return Math.max(20, 80 + 60 * S.base - (hasI('i13') ? 10 : 0)); }
function canBase() { return !inC(3) && S.gens[7].b >= baseReq() && (S.au.baseMax <= 0 || S.base < S.au.baseMax || !S._auto); }
function doBase() {
  if (inC(3) || S.gens[7].b < baseReq()) return false;
  if (S.inf.brk && !S.inf.chal) {   // 打破无穷后：进制跃迁不再重置，并可一次进行多次
    const t8 = S.gens[7].b, off = hasI('i13') ? 10 : 0;
    S.base = Math.max(S.base + 1, Math.floor((t8 - 80 + off) / 60) + 1);
    return true;
  }
  S.base++;
  resetGens(false);
  return true;
}

/* ============================================================
   无穷
   ============================================================ */
function canCrunch() { return S.inf.chal ? S.n.gte(chalGoal(S.inf.chal)) : S.n.gte(INF); }
function resetInfLayer0() {
  resetGens(false);
  S.base = 0;
  if (!hasI('i3')) S.th = {};
  if (!hasI('i8')) S.sv = { x: D(2), lv: 0 };
  S.time.inf = 0;
}
function doCrunch(force) {
  if (!canCrunch()) return false;
  const g = ipGain();
  S.inf.ip = S.inf.ip.add(g); S.inf.tot = S.inf.tot.add(g);
  const ipm = g.div(Math.max(S.time.inf, 1) / 60);
  if (ipm.gt(S.stat.peakIPm)) S.stat.peakIPm = ipm;
  S.inf.cnt++;
  S.inf.fast = Math.min(S.inf.fast, S.time.inf);
  if (S.inf.chal) {
    if (!S.inf.done[S.inf.chal]) emit('chal', S.inf.chal);
    S.inf.done[S.inf.chal] = true; S.inf.chal = 0;
    if ([1, 2, 3, 4, 5, 6, 7, 8].every(i => S.inf.done[i]) && !S.inf.brk) { S.inf.brk = true; emit('break'); }
  }
  if (S.inf.cnt === 1 && S.tr.cnt === 0 && S.st.cnt === 0) emit('firstInf');
  resetInfLayer0();
  return true;
}
function startChal(i) {
  if (S.inf.chal === i) return false;
  if (S.n.gte(INF) && !S.inf.chal) doCrunch();
  S.inf.chal = i;
  resetInfLayer0();
  recalc();
  return true;
}
function exitChal() { S.inf.chal = 0; resetInfLayer0(); }
function buyIU(id) {
  const u = INFU.find(x => x.id === id);
  if (!u || S.inf.upg[id]) return false;
  const idx = INFU.indexOf(u);
  if (idx > 0 && !S.inf.upg[INFU[idx - 1].id]) return false;
  if (S.inf.ip.lt(u.c)) return false;
  S.inf.ip = S.inf.ip.sub(u.c); S.inf.upg[id] = true; return true;
}
function buyBU(id) {
  const u = BRKU.find(x => x.id === id);
  if (!u || S.inf.upg[id] || !S.inf.brk) return false;
  const idx = BRKU.indexOf(u);
  if (idx > 0 && !S.inf.upg[BRKU[idx - 1].id]) return false;
  if (S.inf.ip.lt(pow10(u.c))) return false;
  S.inf.ip = S.inf.ip.sub(pow10(u.c)); S.inf.upg[id] = true; return true;
}
function buyRep(max = true) {
  const r = bulk(REP_COST, S.inf.rep, S.inf.ip, max ? Infinity : 1);
  if (!r) return false;
  S.inf.ip = S.inf.ip.sub(r.spent).max(0); S.inf.rep = r.n; return true;
}
function buyIG(j, max = true) {
  if (!unl.igen()) return false;
  const g = S.inf.g[j];
  const r = bulk(igenCost(j), g.b, S.inf.ip, max ? Infinity : 1);
  if (!r) return false;
  S.inf.ip = S.inf.ip.sub(r.spent).max(0); g.a = g.a.add(r.n - g.b); g.b = r.n; return true;
}

/* ============================================================
   超越
   ============================================================ */
function canTrans() { return S.inf.brk && !S.inf.chal && lg(S.n).gte(TR_REQ); }
function resetTrLayer() {
  const keepBrk = trMile(1);
  S.inf.ip = trMile(8) ? D(1e6) : D(0);
  S.inf.cnt = 0; S.inf.rep = 0; S.inf.fast = 1e300;
  S.inf.g = IGENS.map(() => ({ a: D(0), b: 0 }));
  const up = {};
  for (const id in S.inf.upg) {
    if (id[0] === 'i' && trMile(2)) up[id] = true;
    if (id[0] === 'b' && trMile(3)) up[id] = true;
  }
  S.inf.upg = up;
  if (!keepBrk) { S.inf.brk = false; S.inf.done = {}; }
  S.inf.chal = 0;
  S.time.tr = 0;
  resetInfLayer0();
  S.sv = { x: D(2), lv: 0 };
  S.th = {};
}
function doTrans() {
  if (!canTrans()) return false;
  const g = tpGain();
  S.tr.tp = S.tr.tp.add(g); S.tr.tot = S.tr.tot.add(g);
  if (S.tr.cnt === 0 && S.st.cnt === 0) emit('firstTr');
  S.tr.cnt++;
  S.tr.fast = Math.min(S.tr.fast, S.time.tr);
  resetTrLayer();
  return true;
}
function buyConst(id, max = true) {
  const c = CONSTS.find(x => x.id === id);
  const r = bulk(constCost(c), S.tr.dg[id], S.tr.tp, max ? Infinity : 1);
  if (!r) return false;
  S.tr.tp = S.tr.tp.sub(r.spent).max(0); S.tr.dg[id] = r.n; return true;
}
function buyTU(id) {
  const u = TRU.find(x => x.id === id);
  if (!u || S.tr.upg[id] || S.tr.tp.lt(pow10(u.c))) return false;
  S.tr.tp = S.tr.tp.sub(pow10(u.c)); S.tr.upg[id] = true; return true;
}
function buyFrac(max = true) {
  if (!unl.frac()) return false;
  const r = bulk(FRAC_COST, S.tr.fr, S.tr.tp, max ? Infinity : 1);
  if (!r) return false;
  S.tr.tp = S.tr.tp.sub(r.spent).max(0); S.tr.fr = r.n; return true;
}

/* ============================================================
   集合论（力迫）
   ============================================================ */
function canForce() { return lg(S.n).gte(FO_REQ) && !S.inf.chal; }
function doForce() {
  if (!canForce()) return false;
  const g = kGain();
  S.st.k = S.st.k.add(g); S.st.tot = S.st.tot.add(g);
  if (S.st.cnt === 0) emit('firstFo');
  S.st.cnt++;
  S.tr.tp = D(0);
  if (!hasZ('z1')) S.tr.upg = {};
  if (!hasZ('z4')) S.tr.dg = { pi: 0, e: 0, phi: 0, sqrt2: 0, gamma: 0 };
  S.tr.fr = 0;
  S.time.fo = 0;
  resetTrLayer();
  return true;
}
function buyAx(id) {
  const u = AXIOMS.find(x => x.id === id);
  if (!u || S.st.ax[id] || S.st.k.lt(pow10(u.c))) return false;
  S.st.k = S.st.k.sub(pow10(u.c)); S.st.ax[id] = true; return true;
}
function buyAleph(max = true) {
  const r = bulk(ALEPH_COST, S.st.al, S.st.k, max ? Infinity : 1);
  if (!r) return false;
  S.st.k = S.st.k.sub(r.spent).max(0); S.st.al = r.n; return true;
}

/* ============================================================
   超运算
   ============================================================ */
function buyHU(id) {
  const u = HYU.find(x => x.id === id);
  if (!u || S.hy.upg[id] || !S.hy.on) return false;
  if (slogN() < u.c) return false;
  S.hy.upg[id] = true; return true;
}
function buyHRep() {
  if (!S.hy.on) return false;
  const s = slogN(); let any = false;
  for (let g = 0; g < 200 && s >= hrepNextAt(S.hy.rep); g++) { S.hy.rep++; any = true; }
  return any;
}
function buyPU(id) {
  const u = PEU.find(x => x.id === id);
  if (!u || S.pt.upg[id] || !S.pt.on || S.pt.p < u.c) return false;
  S.pt.upg[id] = true; return true;
}
function buyPRep() {
  if (!S.pt.on) return false;
  let any = false;
  for (let g = 0; g < 200 && S.pt.p >= prepNextAt(S.pt.rep); g++) { S.pt.rep++; any = true; }
  return any;
}
// 当前“显示用”的数的五级高度（未解锁时返回 null）
function pentHeight() {
  if (!S.pt.on) return null;
  return S.pt.p;
}

/* ============================================================
   主循环
   ============================================================ */
let emit = () => {};
function setEmitter(fn) { emit = fn; }

function autos() {
  const A = S.au;
  S._auto = true;
  if (hasI('i3') && A.th) for (const t of THEOREMS) buyTh(t.id);
  if (hasI('i5') || trMile(1)) {
    if (A.gen && A.spd) buyMaxAll();
    else { if (A.gen) for (let k = tiersOpen() - 1; k >= 0; k--) buyGen(k, 'max', S.n.div(4)); if (A.spd) buySpd(true); }
  }
  if (hasI('i8') && A.sieve) buySieve(true);
  if (hasI('i6') || trMile(1)) {
    if (A.base && canBase() && (A.baseMax <= 0 || S.base < A.baseMax)) doBase();
    if (A.boost) for (let i = 0; i < 3 && canBoost(); i++) doBoost();
  }
  if (trMile(5)) {
    if (A.igen) for (let j = 3; j >= 0; j--) buyIG(j, true);
    if (A.rep) buyRep(true);
  }
  if (trMile(2) && A.iupg) { for (const u of INFU) buyIU(u.id); if (S.inf.brk) for (const u of BRKU) buyBU(u.id); }
  if ((hasI('i12') || trMile(1)) && A.cr && canCrunch()) {
    if (!S.inf.brk || S.inf.chal) doCrunch();
    else {
      const g = ipGain();
      let ok = false;
      if (A.crMode === 0) ok = g.gte(D(A.crVal || 1));
      else if (A.crMode === 1) ok = S.time.inf >= Number(A.crVal || 0);
      else ok = g.gte(S.inf.ip.mul(Number(A.crVal || 1)));
      if (ok) doCrunch();
    }
  }
  if (trMile(40) && A.cst) for (const c of CONSTS) buyConst(c.id, true);
  if (trMile(12) && A.tr && canTrans()) {
    const g = tpGain();
    const ok = A.trMode === 0 ? g.gte(D(A.trVal || 1)) : S.time.tr >= Number(A.trVal || 0);
    if (ok) doTrans();
  }
  if (hasZ('z6') && A.fo && canForce()) {
    if (kGain().gte(S.st.k.mul(Number(A.foVal || 2)).max(1))) doForce();
  }
  if (S.hy.on && A.hy) for (const u of HYU) buyHU(u.id);
  if (S.hy.on && A.hrep) buyHRep();
  if (S.pt.on && A.hy) for (const u of PEU) buyPU(u.id);
  if (S.pt.on && A.hrep) buyPRep();
  S._auto = false;
}

function produce(dt) {
  // 计数器链
  const open = tiersOpen();
  const rate = [];
  for (let k = 0; k < 8; k++) rate[k] = k < open ? S.gens[k].a.mul(pow10(C.genLog[k])) : new Decimal(0);
  for (let k = 0; k < 7; k++) if (k + 1 < open) S.gens[k].a = S.gens[k].a.add(rate[k + 1].mul(dt));
  let P = rate[0];
  if (C.hEff > 0 && P.gt(10)) P = P.layeradd10(C.hEff);
  C.P = P;
  S.n = S.n.add(P.mul(dt));
  if ((!S.inf.brk || S.inf.chal) && S.n.gt(INF)) S.n = INF;
  // 质数筛
  if (unl.sieve() && !inC(2)) S.sv.x = S.sv.x.add(C.sieveSpd.mul(dt));
  // ∞ 发生器
  if (unl.igen()) {
    S.inf.ie = S.inf.ie.add(C.ieRate.mul(dt));
  }
  // 被动超越点
  if (S.inf.brk && (trMile(20) || hasZ('z2'))) {
    const p = (hasZ('z2') ? 0.1 : 0) + (trMile(20) ? 0.01 : 0);
    const g = tpGain();
    if (g.gt(0)) { S.tr.tp = S.tr.tp.add(g.mul(p * dt)); S.tr.tot = S.tr.tot.add(g.mul(p * dt)); }
  }
  if (C.teRate > 0) S.tr.te += C.teRate * dt;
  // 集合增长
  if (C.sRate > 0) S.st.s += C.sRate * dt;
  // 塔高
  if (S.hy.on) S.hy.h += hyRate() * dt;
  if (!S.hy.on && lg(S.n).gte(HY_REQ)) { S.hy.on = true; emit('hyper'); }
  if (S.pt.on) S.pt.p += peRate() * dt;
  if (!S.pt.on && S.hy.on && slogN() >= PENT_REQ) { S.pt.on = true; S.pt.p = Math.max(S.pt.p, 2); emit('pent'); }
}

let achTimer = 0;
function tick(dt) {
  if (!(dt > 0)) return;

const CN_UNITS = [[1e68, '无量大数'], [1e64, '不可思议'], [1e60, '那由他'], [1e56, '阿僧祇'], [1e52, '恒河沙'], [1e48, '极'], [1e44, '载'], [1e40, '正'], [1e36, '涧'], [1e32, '沟'], [1e28, '穰'], [1e24, '秭'], [1e20, '垓'], [1e16, '京'], [1e12, '兆'], [1e8, '亿'], [1e4, '万']];
function commas(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtSmall(n, dp) {
  if (n === 0) return '0';
  if (n < 0.001) return n.toExponential(1);
  if (n < 10) return n.toFixed(dp);
  if (n < 100) return n.toFixed(Math.min(dp, 1));
  if (n < 1e6) return commas(n);
  return null;
}
function fmt(x, dp = 2) {
  x = D(x);
  if (x.sign < 0) return '−' + fmt(x.neg(), dp);
  if (!x.isFinite || !Number.isFinite(x.mag)) return '∞';
  if (x.lt(1e6)) return fmtSmall(x.toNumber(), dp) ?? commas(x.toNumber());
  const sl = x.slog(10).toNumber();
  if (sl >= 6) return '10↑↑' + sl.toFixed(3);
  const L = x.log10();
  const nota = S ? S.opt.nota : 'sci';
  if (L.lt(1e6)) {
    const Ln = L.toNumber();
    if (nota === 'log') return 'e' + Ln.toFixed(2);
    if (nota === 'cn' && Ln < 72) {
      for (const [v, u] of CN_UNITS) if (x.toNumber() >= v) return (x.toNumber() / v).toFixed(2) + u;
    }
    let e = Math.floor(Ln), m = Math.pow(10, Ln - e);
    if (m >= 9.995) { m = 1; e++; }
    if (nota === 'eng') { const r = ((e % 3) + 3) % 3; return (m * Math.pow(10, r)).toFixed(dp) + 'e' + commas(e - r); }
    return m.toFixed(dp) + 'e' + commas(e);
  }
  return 'e' + fmt(L, dp);
}
function fmtN(n) { if (n >= 1e9) return fmt(D(n)); return commas(n); }
function fmtX(x) { return '×' + fmt(x); }
function fmtTime(s) {
  if (!Number.isFinite(s) || s > 3e13) return '很久';
  if (s < 1) return s.toFixed(2) + ' 秒';
  if (s < 60) return s.toFixed(1) + ' 秒';
  if (s < 3600) return Math.floor(s / 60) + ' 分 ' + Math.floor(s % 60) + ' 秒';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时 ' + Math.floor(s % 3600 / 60) + ' 分';
  return Math.floor(s / 86400) + ' 天 ' + Math.floor(s % 86400 / 3600) + ' 小时';
}
// 数学排版：主数字
function sup(s) { return '<sup>' + s + '</sup>'; }
function mantExp(L) {   // L < 1e6 (number)
  let e = Math.floor(L), m = Math.pow(10, L - e);
  if (m >= 9.9995) { m = 1; e++; }
  return { m, e };
}
function heroHTML(x) {
  if (S.pt.on && S.pt.p > 2) return '10<span class="arr">↑↑↑</span>' + S.pt.p.toFixed(4);
  x = D(x);
  if (x.lt(1e6)) { const n = x.toNumber(); return n < 10 ? n.toFixed(1) : commas(n); }
  const sl = x.slog(10).toNumber();
  if (sl >= 6) return '10<span class="arr">↑↑</span>' + sl.toFixed(4);
  let v = x, d = 0;
  while (v.gte(1e6) && d < 6) { v = v.log10(); d++; }
  // d=1：x < 10^(10^6)
  if (d === 1) { const { m, e } = mantExp(x.log10().toNumber()); return m.toFixed(3) + '<span class="x">×</span>10' + sup(commas(e)); }
  // d≥2：取 d-1 次对数后得到 [1e6, 1e1e6) 的值，作塔顶
  let top = x; for (let i = 0; i < d - 1; i++) top = top.log10();
  const { m, e } = mantExp(top.log10().toNumber());
  let inner = m.toFixed(2) + '<span class="x">×</span>10' + sup(commas(e));
  for (let i = 0; i < d - 1; i++) inner = '10' + sup(inner);
  return inner;
}

function toggle(label, get, set) {
  const i = h('input', { type: 'checkbox' });
  i.checked = get(); i.onchange = () => set(i.checked);

function drawSierpinski(cv, depth, color) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;

  tri(10, H - 6, W - 20, depth);
}

  const items = ACH.map(a => { const el = h('div', { class: 'ach', title: a.d }, h('b', null, a.n), h('span', null, a.d)); g.append(el); return { a, el }; });
  v.append(g, h('h3', null, '著名的数', h('span', { class: 'sub' }, '你数过的那些数')));
  const fl = h('div', { class: 'flist' });
  const fi = FAMOUS.map(([x, n, d]) => { const r = h('div', null, h('span', { class: 'm' }), h('b', null, n), h('span', null, d)); fl.append(r); return { x, r }; });
  const extra = [['10↑↑↑2 decker', () => S.pt.on], ['tritri 3↑↑↑3', () => S.pt.on && S.pt.p >= 2.32], ['10↑↑↑3', () => S.pt.on && S.pt.p >= 3], ['tridecal 10↑↑↑10', () => S.pt.on && S.pt.p >= 10]];
  const ei = extra.map(([n, f]) => { const r = h('div', null, h('span', { class: 'm' }), h('b', null, n), h('span', null, '五级运算的领域')); fl.append(r); return { f, r }; });
  v.append(fl);
  return () => {
    const n = Object.keys(S.ach).length;
    setText(cnt, '已达成 ' + n + ' / ' + ACH.length + '，所有计数器 ×' + Math.pow(1.03, n).toFixed(2));
    items.forEach(({ a, el }) => setCls(el, 'got', !!S.ach[a.id]));
    fi.forEach(({ x, r }) => { const ok = S.maxN.gte(x); setCls(r, 'got', ok); setText(r.firstChild, ok ? '✓' : ''); });
    ei.forEach(({ f, r }) => { const ok = f(); setCls(r, 'got', ok); setText(r.firstChild, ok ? '✓' : ''); });
  };
}

/* ---------- 统计 ---------- */
function viewStat(v) {
  v.append(head('', '统计'));
  const d = kv([
    ['总游戏时间', () => fmtTime(S.time.all)],
    ['其中离线', () => fmtTime(S.time.offline)],
    ['到过的最大的数', () => (S.pt.on && S.pt.p > 2) ? '10↑↑↑' + S.pt.p.toFixed(4) : fmt(S.maxN)],
    ['最高塔高', () => '10↑↑' + S.stat.maxSlog.toFixed(4)],
    ['点击“数一数”', () => fmtN(S.clicks) + ' 次'],
    ['无穷', () => fmtN(S.inf.cnt) + ' 次（本次超越内），最快 ' + (S.inf.fast < 1e299 ? fmtTime(S.inf.fast) : '—')],
    ['累计 ∞ 点', () => fmt(S.inf.tot)],
    ['超越', () => fmtN(S.tr.cnt) + ' 次，最快 ' + (S.tr.fast < 1e299 ? fmtTime(S.tr.fast) : '—')],
    ['累计超越点', () => fmt(S.tr.tot)],

    ['累计基数', () => fmt(S.st.tot)],
    ['计数器内在倍率的总指数', () => fmt(C.E)],
    ['通关用时', () => S.end.done ? fmtTime(S.end.time) : '尚未抵达 10↑↑↑10'],
    ['读过的快讯', () => fmtN(S.stat.newsRead) + ' 条'],
  ]);
  v.append(h('div', { class: 'panel' }, d));
  return () => d._upd();
}

/* ---------- 设置 ---------- */
function viewOpt(v) {
  v.append(head('', '设置'));
  const nota = h('select', null, ...[['sci', '科学计数 1.23e45'], ['eng', '工程计数 12.3e44'], ['cn', '中文单位 1.23载'], ['log', '对数 e45.09']].map(([a, b]) => h('option', { value: a }, b)));
  nota.value = S.opt.nota; nota.onchange = () => S.opt.nota = nota.value;
  const theme = h('select', null, h('option', { value: 'auto' }, '跟随系统'), h('option', { value: 'light' }, '方格纸'), h('option', { value: 'dark' }, '黑板'));
  theme.value = S.opt.theme; theme.onchange = () => { S.opt.theme = theme.value; applyTheme(); };
  const fps = h('select', null, ...[10, 20, 30].map(x => h('option', { value: x }, x + ' 帧/秒')));
  fps.value = S.opt.fps; fps.onchange = () => S.opt.fps = +fps.value;
  const tgs = [toggle('显示数学快讯', () => S.opt.news, x => { S.opt.news = x; rotateNews(true); }), toggle('离线进度', () => S.opt.offline, x => S.opt.offline = x), toggle('重置前确认', () => S.opt.conf, x => S.opt.conf = x)];
  v.append(h('div', { class: 'panels' },
    h('div', { class: 'panel' }, h('h4', null, '显示'), h('div', { class: 'row' }, h('span', null, '记数法'), nota), h('div', { class: 'row', style: 'margin-top:8px' }, h('span', null, '主题'), theme), h('div', { class: 'row', style: 'margin-top:8px' }, h('span', null, '刷新'), fps)),
    h('div', { class: 'panel' }, h('h4', null, '游戏'), ...tgs.map(t => h('div', null, t)))));
  const ta = h('textarea', { placeholder: '把存档文本粘贴到这里，然后点“导入”', 'aria-label': '存档文本' });
  const msg = h('p', { class: 'muted' });
  v.append(h('h3', null, '存档'), h('div', { class: 'panel' },
    h('p', { class: 'muted' }, '游戏每 10 秒自动保存在这个浏览器里。换设备时，用导出的文本搬家。'), ta,
    h('div', { class: 'row', style: 'margin-top:8px' },
      btn('导出到文本框', () => { ta.value = exportSave(); ta.select(); setText(msg, '已导出。复制文本框里的内容即可保存。'); }),
      btn('复制存档', async () => { const t = exportSave(); ta.value = t; try { await navigator.clipboard.writeText(t); setText(msg, '存档已复制到剪贴板。'); } catch (e) { ta.select(); setText(msg, '无法自动复制，请手动复制文本框内容。'); } }),
      btn('导入', () => { try { importSave(ta.value); applyTheme(); rebuild(); save(); setText(msg, '导入成功。'); } catch (e) { setText(msg, '导入失败：这段文本不是有效的存档。'); } }),
      btn('立即保存', () => { save(); setText(msg, '已保存。'); })), msg));
  v.append(h('h3', null, '危险区'), h('div', { class: 'panel' }, h('p', { class: 'muted' }, '硬重置会删除全部进度，无法撤销。'),
    btn('硬重置', () => modal({ title: '删除全部进度？', body: '<p>你将回到 10 个数的起点。这无法撤销。</p>', acts: [{ t: '取消' }, { t: '删除', red: true, f: () => { hardReset(); save(); applyTheme(); rebuild(); } }] }), 'red')));
  v.append(h('h3', null, '关于'), h('div', { class: 'panel' }, h('p', null, '数之塔 v1.0.0。从 1 数到 10↑↑↑10。'),
    h('p', { class: 'muted' }, '快捷键：M 全部最大，S 运算速度最大，D 数位扩展，G 进制跃迁，I 抵达无穷，T 超越，F 力迫。'),
    h('p', { class: 'muted' }, '大数运算使用 break_eternity.js（MIT 许可）。常数的位数由 mpmath 计算。')));
  return () => tgs.forEach(t => t._sync());
}

/* ---------- 导航 ---------- */
const TABS = [
  { id: 'count', s: '§1', n: '计数', v: viewCount, u: () => true },
  { id: 'theo', s: '§2', n: '定理', v: viewTheo, u: () => S.maxN.gte(100) || unl.inf(), hint: '数到 100' },
  { id: 'prime', s: '§3', n: '质数', v: viewPrime, u: () => unl.sieve(), hint: '证明埃拉托色尼筛法' },
  { id: 'inf', s: '§4', n: '无穷', v: viewInf, u: () => unl.inf(), hint: '数到 1.8×10³⁰⁸' },
  { id: 'chal', s: '§5', n: '猜想', v: viewChal, u: () => unl.chal(), hint: '抵达一次无穷' },
  { id: 'trans', s: '§6', n: '超越', v: viewTrans, u: () => S.inf.brk || S.tr.cnt > 0 || S.st.cnt > 0, hint: '打破无穷' },
  { id: 'set', s: '§7', n: '集合', v: viewSet, u: () => S.st.cnt > 0 || S.tr.cnt > 0, hint: '超越一次' },
  { id: 'hyper', s: '§8', n: '超运算', v: viewHyper, u: () => S.hy.on, hint: '数到 10^(10¹⁰⁰)' },
  { id: 'pent', s: '§9', n: '五级运算', v: viewPent, u: () => S.pt.on, hint: '数到 10↑↑10' },
  { sep: true },
  { id: 'ach', s: '', n: '成就', v: viewAch, u: () => true },
  { id: 'stat', s: '', n: '统计', v: viewStat, u: () => true },
  { id: 'opt', s: '', n: '设置', v: viewOpt, u: () => true },
];
const navBtns = {};
function buildNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  for (const t of TABS) {
    if (t.sep) { nav.append(h('hr')); continue; }
    const b = h('button', { onclick: () => { if (t.u()) go(t.id); } }, h('span', { class: 's' }, t.s), h('span', { class: 'n' }, t.n), h('span', { class: 'dot' }));
    navBtns[t.id] = b; nav.append(b);
  }
}
function updNav() {
  let shownLocked = false;
  for (const t of TABS) {
    if (t.sep) continue;
    const b = navBtns[t.id], ok = t.u();
    if (ok && !UI.seenTabs[t.id] && t.id !== 'count') { UI.seenTabs[t.id] = 1; if (UI.started) UI.notify[t.id] = true; }
    if (ok) { show(b, true); setCls(b, 'locked', false); setText(b.children[1], t.n); b.title = ''; }
    else if (!shownLocked && t.s) { shownLocked = true; show(b, true); setCls(b, 'locked', true); setText(b.children[1], '？？？'); b.title = '解锁条件：' + t.hint; }
    else show(b, false);
    b.setAttribute('aria-current', UI.tab === t.id ? 'page' : 'false');
    setCls(b, 'notify', !!UI.notify[t.id] && UI.tab !== t.id);
  }
}
function go(id) {
  UI.tab = id; UI.notify[id] = false;
  const v = $('#view'); v.innerHTML = '';
  const t = TABS.find(x => x.id === id);
  UI.upd = t.v(v);
  UI.upd();
  window.scrollTo({ top: 0 });
}
function rebuild() { go(UI.tab); updNav(); }

/* ---------- 侧栏 ---------- */
let rateEMA = null, lastSlog = null;
function updRail() {
  setHTML($('#heroVal'), heroHTML(S.n));
  let r = '';
  if (S.pt.on && S.pt.p > 2) r = 'p 每小时 +' + (peRate() * 3600).toFixed(4);
  else if (S.hy.on && slogN() >= 4) r = '塔高每小时 +' + (hyRate() * 3600).toFixed(4);
  else if (C.P && C.P.gt(0)) r = '每秒 +' + fmt(C.P);
  if (S.inf.chal) r += '　·　证明中：' + CHALS[S.inf.chal - 1].n;
  setText($('#heroRate'), r);
  // 下一个著名的数
  const f = FAMOUS.find(([x]) => S.maxN.lt(x));
  const el = $('#famous');
  if (f) {
    const a = S.maxN.max(1).slog(10).toNumber(), b = f[0].slog(10).toNumber();
    const prev = FAMOUS[FAMOUS.indexOf(f) - 1];
    const a0 = prev ? prev[0].slog(10).toNumber() : 0;
    const pct = Math.max(0, Math.min(1, (a - a0) / (b - a0)));
    setHTML(el, '下一个著名的数：<b>' + f[1] + '</b><div class="bar"><i style="width:' + (pct * 100).toFixed(1) + '%"></i></div>');
  } else setHTML(el, S.pt.on ? '下一个目标：<b>' + (S.pt.p < 10 ? 'tridecal 10↑↑↑10' : '更远的地方') + '</b>' : '');
  updNav();
}

/* ============================================================
   主循环
   ============================================================ */
let lastReal = Date.now(), lastRender = 0, saveTimer = 0;
function stepGame() {
  if (UI.offline) return;
  const now = Date.now();
  let dt = (now - lastReal) / 1000; lastReal = now;
  if (dt <= 0) return;
  if (dt > 60) { runOffline(dt); return; }
  while (dt > 0) { const st = Math.min(dt, 0.25); tick(st); dt -= st; }
  saveTimer += 0.05;
}
function render(t) {
  requestAnimationFrame(render);
  if (UI.offline) return;
  if (t - lastRender < 1000 / (S.opt.fps || 20)) return;
  lastRender = t;
  try { updRail(); UI.upd && UI.upd(); } catch (e) { console.error(e); }
}
function runOffline(sec) {
  if (!S.opt.offline || sec < 10) { S.last = Date.now(); return; }
  UI.offline = true;
  const before = (S.pt.on && S.pt.p > 2) ? '10↑↑↑' + S.pt.p.toFixed(4) : fmt(S.n);
  const ticks = Math.min(4000, Math.max(200, Math.ceil(sec / 2))), dt = sec / ticks;
  const box = $('#modalBox');
  box.innerHTML = '<h2>你离开了 ' + fmtTime(sec) + '</h2><p>这座塔在你离开时一直在数。正在补算……</p><div class="bar"><i id="offBar"></i></div>';
  $('#modal').classList.add('on');
  let done = 0;
  const batch = () => {
    const end = Math.min(ticks, done + 40);
    for (; done < end; done++) tick(dt);
    $('#offBar').style.width = (done / ticks * 100).toFixed(1) + '%';
    if (done < ticks) { setTimeout(batch, 0); return; }
    S.time.offline += sec; S.stat.offlineGot = true;
    UI.offline = false; lastReal = Date.now(); save();
    const after = (S.pt.on && S.pt.p > 2) ? '10↑↑↑' + S.pt.p.toFixed(4) : fmt(S.n);
    modal({ title: '欢迎回来', body: '<p>你离开了 ' + fmtTime(sec) + '。</p><p>数从 <span class="num">' + before + '</span> 变成了 <span class="num">' + after + '</span>。</p>', acts: [{ t: '继续', f: flushPending }] });
    rebuild();
  };
  setTimeout(batch, 30);
}
function flushPending() {
  if (UI.pendingEnd) { UI.pendingEnd = false; UI.pendingStory = []; showEnding(); return; }
  const st = UI.pendingStory.pop(); UI.pendingStory = [];
  if (st) modal(st);
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('#modal').classList.contains('on')) { if (e.key === 'Escape' && !UI.offline) closeModal(); return; }
  const k = e.key.toLowerCase();
  if (k === 'm') buyMaxAll();
  else if (k === 's') buySpd(true);
  else if (k === 'd') doBoost();
  else if (k === 'g') doBase();
  else if (k === 'i') doCrunch();
  else if (k === 't') { if (canTrans()) doTrans(); }
  else if (k === 'f') { if (canForce()) doForce(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
window.addEventListener('beforeunload', save);

function start() {
  setEmitter(onEmit);
  const had = load();
  applyTheme();
  buildNav();
  for (const t of TABS) if (!t.sep && t.u()) UI.seenTabs[t.id] = 1;
  go('count');
  rotateNews(true);
  UI.started = true;
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  lastReal = Date.now();
  if (had && away > 60) runOffline(away);
  else if (!had) modal({ glyph: '1, 2, 3…', title: '数之塔', body: '<p>从手指开始数，一直数到 10↑↑↑10。</p><p>先点几下“数一数”，攒够 10 个数买下第一根手指。之后的事情，交给数学。</p>', acts: [{ t: '开始数' }] });
  setInterval(stepGame, 50);
  setInterval(() => { if (!UI.offline) save(); }, 10000);
  setInterval(() => rotateNews(), 12000);
  requestAnimationFrame(render);
}
start();

</script>
